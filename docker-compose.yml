services:
  postgres:
    image: postgres:16-alpine
    container_name: messaver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messaver_secure_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-messaver_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-messaver_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: messaver-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: messaver-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-messaver_secure_local_dev_password}@postgres:5432/${POSTGRES_DB:-messaver_db}
      REDIS_URL: redis://redis:6379/0
      REDIS_FALLBACK_TO_MEMORY: "false"
      SESSION_SECRET: ${SESSION_SECRET:-a_default_secure_32_character_session_signing_secret_for_containers}
      CSRF_SECRET: ${CSRF_SECRET:-a_default_secure_32_character_csrf_signing_secret_for_containers}
      PIN_PEPPER: ${PIN_PEPPER:-messaver_secret_pickup_pin_pepper_salt}
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5173"]'
      TRUSTED_PROXIES: '["127.0.0.1","::1","frontend"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: messaver-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
